server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: weather-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Simulated weather business service
