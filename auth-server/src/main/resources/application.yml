server:
  port: 8083
  servlet:
    session:
      # Session idle timeout follows the configured OAuth lifetime.
      timeout: ${auth.oauth.session-idle-timeout}

spring:
  application:
    name: auth-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/auth?preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

auth:
  # 正式环境必须为：https://auth.example.com，且不能有末尾斜杠
  issuer: ${AUTH_ISSUER:http://localhost:8083}
  resources:
    # weather:read token 的 audiences 绑定目标，必须与 weather-mcp-server 的
    # weather.mcp.resource-base-url + /mcp 一致
    weather-mcp: ${WEATHER_MCP_RESOURCE:http://localhost:8081/mcp}
  keystore:
    location: ${AUTH_KEYSTORE_PATH:}
    password: ${AUTH_KEYSTORE_PASSWORD:}
    type: ${AUTH_KEYSTORE_TYPE:PKCS12}
    alias: ${AUTH_KEYSTORE_ALIAS:}
  oauth:
    authorization-code-ttl: ${AUTH_AUTHORIZATION_CODE_TTL:PT5M}
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:PT10M}
    id-token-ttl: ${AUTH_ID_TOKEN_TTL:PT10M}
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:P30D}
    session-idle-timeout: ${AUTH_SESSION_IDLE_TIMEOUT:PT30M}
