<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose organization</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 3rem auto; max-width: 28rem; }
        form { display: grid; gap: 0.75rem; }
        button { font-size: 1rem; padding: 0.6rem; text-align: left; }
    </style>
</head>
<body>
<h1>Choose an organization</h1>
<p th:text="'Signed in as ' + ${user.account()}">Signed in as alice</p>
<form th:action="@{/organizations}" method="post">
    <button type="submit" th:each="organization : ${organizations}"
            th:name="orgId" th:value="${organization.id()}"
            th:text="${organization.name()}">Organization</button>
</form>
</body>
</html>
