<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 3rem auto; max-width: 24rem; }
        form { display: grid; gap: 0.75rem; }
        label { font-weight: 600; }
        input, button { font-size: 1rem; padding: 0.5rem; }
        .alert { color: #b00020; }
    </style>
</head>
<body>
<h1>Sign in</h1>
<p class="alert" th:if="${param.error}" role="alert">Invalid account or password.</p>
<p th:if="${param.logout}" role="status">You have been signed out.</p>
<form th:action="@{/login}" method="post">
    <label for="username">Account</label>
    <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
</form>
</body>
</html>
