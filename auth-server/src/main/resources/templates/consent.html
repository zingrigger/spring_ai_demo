<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Authorize access</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 3rem auto; max-width: 30rem; }
        form { display: grid; gap: 0.75rem; }
        ul { margin: 0; padding-left: 1.25rem; }
        button { font-size: 1rem; padding: 0.6rem; }
    </style>
</head>
<body>
<h1>Authorize access</h1>
<p th:if="${organization != null}">
    <strong th:text="${clientName}">Client</strong> requests access as
    <strong th:text="${user != null} ? ${user.account()} : ''">alice</strong>
    in organization <strong th:text="${organization.orgName()}">Organization</strong>.
</p>
<p th:if="${organization == null}">
    <strong th:text="${clientName}">Client</strong> requests access to your account.
</p>
<form th:action="@{/oauth2/authorize}" method="post">
    <input type="hidden" name="client_id" th:value="${clientId}">
    <input type="hidden" name="state" th:value="${state}">
    <fieldset>
        <legend>Requested scopes</legend>
        <label th:each="scope : ${scopes}" th:for="'scope-' + ${scope}">
            <input type="checkbox" name="scope" th:id="'scope-' + ${scope}"
                   th:value="${scope}" checked>
            <span th:text="${scope}">scope</span>
        </label>
        <p th:if="${#lists.isEmpty(scopes)}">This client requests no additional scopes.</p>
    </fieldset>
    <p>Roles are always limited to the selected organization.</p>
    <button type="submit">Approve</button>
</form>
</body>
</html>
