server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: weather-mcp-server
  ai:
    mcp:
      server:
        name: weather-mcp-server
        version: 1.0.0
        protocol: STATELESS
        streamable-http:
          mcp-endpoint: /mcp
  cloud:
    openfeign:
      client:
        config:
          weather-service:
            connectTimeout: 2000
            readTimeout: 3000

# This MCP server is an OAuth 2.1 resource server only. Tokens are issued by
# the external auth-server; weather:read tokens are audience-bound to
# resource-base-url + /mcp.
weather:
  mcp:
    resource-base-url: ${MCP_RESOURCE_BASE_URL:http://localhost:8081}
    authorization-server-url: ${AUTH_SERVER_URL:http://localhost:8083}
    required-scope: ${MCP_REQUIRED_SCOPE:weather:read}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Streamable HTTP weather MCP server
